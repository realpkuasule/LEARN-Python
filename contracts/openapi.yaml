{
  "openapi": "3.1.0",
  "info": {
    "title": "Python DragonQuest MVP API",
    "version": "1.0.0",
    "description": "Contract for course discovery, isolated Python exercise execution, and provider-neutral AI tutoring. Game progress remains local."
  },
  "servers": [{ "url": "/" }],
  "paths": {
    "/api/health": {
      "get": {
        "operationId": "getHealth",
        "tags": ["System"],
        "responses": {
          "200": {
            "description": "Service status",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/HealthResponse" }
              }
            }
          }
        }
      }
    },
    "/api/chapters": {
      "get": {
        "operationId": "listChapters",
        "tags": ["Chapters"],
        "responses": {
          "200": {
            "description": "All 17 chapter summaries",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["chapters"],
                  "properties": {
                    "chapters": {
                      "type": "array",
                      "minItems": 17,
                      "maxItems": 17,
                      "items": { "$ref": "#/components/schemas/ChapterSummary" }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/ai/tutor": {
      "post": {
        "operationId": "streamAiTutorReply",
        "tags": ["AI Tutor"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/AiTutorRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Server-sent AI tutor events ending with done or error",
            "content": {
              "text/event-stream": {
                "schema": { "$ref": "#/components/schemas/AiTutorEvent" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Problem" },
          "404": { "$ref": "#/components/responses/Problem" },
          "413": { "$ref": "#/components/responses/Problem" },
          "503": { "$ref": "#/components/responses/Problem" }
        }
      }
    },
    "/api/chapters/{chapterNumber}": {
      "get": {
        "operationId": "getChapter",
        "tags": ["Chapters"],
        "parameters": [
          {
            "name": "chapterNumber",
            "in": "path",
            "required": true,
            "schema": { "type": "integer", "minimum": 1, "maximum": 17 }
          }
        ],
        "responses": {
          "200": {
            "description": "Chapter content and one assessed exercise",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ChapterDetail" }
              }
            }
          },
          "404": { "$ref": "#/components/responses/Problem" }
        }
      }
    },
    "/api/executions": {
      "post": {
        "operationId": "executeExercise",
        "tags": ["Executions"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ExecutionRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "A completed evaluation, including learner-code failures",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ExecutionResult" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Problem" },
          "404": { "$ref": "#/components/responses/Problem" },
          "413": { "$ref": "#/components/responses/Problem" },
          "503": { "$ref": "#/components/responses/Problem" }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "HealthResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["status", "executionService"],
        "properties": {
          "status": { "type": "string", "enum": ["ok", "degraded"] },
          "executionService": { "type": "string", "enum": ["ready", "unavailable"] }
        }
      },
      "ChapterSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["number", "title", "location", "region", "isBoss", "rewardExp", "rewardCoins"],
        "properties": {
          "number": { "type": "integer", "minimum": 1, "maximum": 17 },
          "title": { "type": "string", "minLength": 1 },
          "location": { "type": "string", "minLength": 1 },
          "region": { "type": "string", "minLength": 1 },
          "isBoss": { "type": "boolean" },
          "bossName": { "type": "string", "minLength": 1 },
          "rewardExp": { "type": "integer", "minimum": 100 },
          "rewardCoins": { "type": "integer", "minimum": 50 },
          "titleReward": { "type": "string", "minLength": 1 },
          "dropItemIds": {
            "type": "array",
            "uniqueItems": true,
            "items": { "type": "string", "minLength": 1 }
          }
        }
      },
      "ChapterDetail": {
        "allOf": [
          { "$ref": "#/components/schemas/ChapterSummary" },
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["contentMarkdown", "exercise"],
            "properties": {
              "contentMarkdown": { "type": "string", "minLength": 1 },
              "exercise": { "$ref": "#/components/schemas/Exercise" }
            }
          }
        ]
      },
      "Exercise": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "chapterNumber", "title", "instructions", "starterCode", "testCount"],
        "properties": {
          "id": { "type": "string", "pattern": "^chapter-[0-9]{2}-final$" },
          "chapterNumber": { "type": "integer", "minimum": 1, "maximum": 17 },
          "title": { "type": "string", "minLength": 1 },
          "instructions": { "type": "string", "minLength": 1 },
          "starterCode": { "type": "string", "minLength": 1 },
          "testCount": { "type": "integer", "minimum": 1, "maximum": 5, "description": "Number of assessment cases; private inputs and expectations are never exposed." }
        }
      },
      "ExecutionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["exerciseId", "code", "mode"],
        "properties": {
          "exerciseId": { "type": "string", "pattern": "^chapter-[0-9]{2}-final$" },
          "code": { "type": "string", "minLength": 1, "maxLength": 20000 },
          "mode": { "type": "string", "enum": ["practice", "formal"], "description": "Practice runs learner code once; formal runs the chapter assessment." },
          "stdin": { "type": "string", "maxLength": 20000, "description": "Optional standard input supplied to the Python process." }
        }
      },
      "ExecutionResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["status", "stdout", "stderr", "durationMs", "message", "testsPassed", "testsTotal"],
        "properties": {
          "status": { "type": "string", "enum": ["passed", "failed", "error", "timeout"] },
          "stdout": { "type": "string", "maxLength": 65536 },
          "stderr": { "type": "string", "maxLength": 65536 },
          "durationMs": { "type": "integer", "minimum": 0, "maximum": 10000 },
          "message": { "type": "string", "minLength": 1 },
          "testsPassed": { "type": "integer", "minimum": 0, "maximum": 5 },
          "testsTotal": { "type": "integer", "minimum": 1, "maximum": 5 }
        }
      },
      "AiTutorExecution": {
        "type": "object",
        "additionalProperties": false,
        "required": ["status", "message"],
        "properties": {
          "status": { "type": "string", "enum": ["passed", "failed", "error", "timeout"] },
          "message": { "type": "string", "minLength": 1, "maxLength": 4000 }
        }
      },
      "AiTutorRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["chapterNumber", "exerciseId", "question", "code", "chapterCompleted"],
        "properties": {
          "chapterNumber": { "type": "integer", "minimum": 1, "maximum": 17 },
          "exerciseId": { "type": "string", "pattern": "^chapter-[0-9]{2}-final$" },
          "question": { "type": "string", "minLength": 1, "maxLength": 2000 },
          "code": { "type": "string", "maxLength": 20000 },
          "execution": { "$ref": "#/components/schemas/AiTutorExecution" },
          "chapterCompleted": { "type": "boolean" }
        }
      },
      "AiTutorEvent": {
        "oneOf": [
          { "$ref": "#/components/schemas/AiTutorMetaEvent" },
          { "$ref": "#/components/schemas/AiTutorDeltaEvent" },
          { "$ref": "#/components/schemas/AiTutorDoneEvent" },
          { "$ref": "#/components/schemas/AiTutorErrorEvent" }
        ]
      },
      "AiTutorMetaEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type", "mode"],
        "properties": {
          "type": { "const": "meta" },
          "mode": { "type": "string", "enum": ["tutor", "collaborate"] }
        }
      },
      "AiTutorDeltaEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type", "content"],
        "properties": {
          "type": { "const": "delta" },
          "content": { "type": "string" }
        }
      },
      "AiTutorDoneEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type"],
        "properties": {
          "type": { "const": "done" }
        }
      },
      "AiTutorErrorEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type", "message"],
        "properties": {
          "type": { "const": "error" },
          "message": { "type": "string", "minLength": 1 }
        }
      },
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": ["status", "code", "message"],
        "properties": {
          "status": { "type": "integer", "minimum": 400, "maximum": 599 },
          "code": { "type": "string", "minLength": 1 },
          "message": { "type": "string", "minLength": 1 }
        }
      }
    },
    "responses": {
      "Problem": {
        "description": "Request or service problem",
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/Problem" }
          }
        }
      }
    }
  }
}
